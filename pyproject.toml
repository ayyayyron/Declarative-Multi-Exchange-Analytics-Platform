[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "producer/generated"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["producer/generated"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "LOG", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ['^\.venv/', '^producer/generated/']

[[tool.mypy.overrides]]
module = "producer.generated.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
