[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = "processing/decoders/mexc/generated"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["processing/decoders/mexc/generated"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "LOG", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ['^\.venv/', '^processing/decoders/mexc/generated/']

[[tool.mypy.overrides]]
module = "processing.decoders.mexc.generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["confluent_kafka", "confluent_kafka.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
