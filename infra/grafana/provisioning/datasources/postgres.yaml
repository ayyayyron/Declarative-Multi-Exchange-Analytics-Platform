apiVersion: 1
datasources:
  - name: Market PostgreSQL
    uid: market-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: $GRAFANA_DB_NAME
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      connMaxLifetime: 300
      maxOpenConns: 4
      maxIdleConns: 2
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
